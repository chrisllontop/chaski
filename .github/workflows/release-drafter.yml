name: Release Drafter

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: read

# Two drafts from the same merged pull requests: the release (v0.1.0), with everything since the
# last one, and its next pre-release (v0.1.0-rc.N), with what changed since the previous
# pre-release. Publishing either runs the Release workflow; a pre-release goes to npm as next.
jobs:
  update_release_draft:
    runs-on: ubuntu-latest
    steps:
      - name: Draft release (v*)
        uses: release-drafter/release-drafter@v7
        with:
          config-name: release-drafter.yml

  update_prerelease_draft:
    runs-on: ubuntu-latest
    steps:
      - name: Draft pre-release (v*-rc.*)
        uses: release-drafter/release-drafter@v7
        with:
          config-name: release-drafter.yml
          prerelease-identifier: rc
