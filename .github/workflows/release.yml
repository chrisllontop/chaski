name: Release

on:
  release:
    types: [published]

# id-token lets npm exchange the workflow's OIDC token for a publish token (trusted publishing), so
# the repository holds no npm secret.
permissions:
  contents: read
  id-token: write

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    if: ${{ startsWith(github.event.release.tag_name, 'v') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0

      # npm takes the version from package.json. A release's tag is that version. A pre-release's
      # tag adds a suffix to it (v0.1.0-rc.1 for 0.1.0), so each pre-release of a version needs no
      # bump of its own, and it goes out under the next dist-tag, leaving latest where it was.
      - name: Validate release source
        id: release
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          git merge-base --is-ancestor HEAD origin/main
          version="$(node -p "require('./package.json').version")"
          if [[ "$PRERELEASE" == "true" ]]; then
            [[ "$RELEASE_TAG" == "v$version-"?* ]] || { echo "Pre-release tag $RELEASE_TAG must be v$version-<suffix>, such as v$version-rc.0"; exit 1; }
            echo "dist-tag=next" >> "$GITHUB_OUTPUT"
          else
            [[ "$RELEASE_TAG" == "v$version" ]] || { echo "Tag $RELEASE_TAG does not match package version $version"; exit 1; }
            echo "dist-tag=latest" >> "$GITHUB_OUTPUT"
          fi

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      # In this checkout only: main keeps the version without the suffix.
      - name: Take the pre-release version from the tag
        if: ${{ github.event.release.prerelease }}
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: npm pkg set version="${RELEASE_TAG#v}"

      - run: pnpm build

      - run: npm publish --tag ${{ steps.release.outputs.dist-tag }}
